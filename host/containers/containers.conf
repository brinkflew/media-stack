# ==============================================================================
# Podman engine settings for the `core` user
# ------------------------------------------------------------------------------
# SYMLINKED TO ~/.config/containers/containers.conf, so `git pull` is the whole
# deploy. Unlike the journald drop-in beside this file, a symlink works here:
# podman runs as `core`, an ordinary user process, and reading var_t is fine for
# it. The four quadlet directories under ~/.config/containers/systemd/ are
# already symlinks into this checkout and prove the point.
#
# It lives under host/ rather than apps/ because it configures the container
# ENGINE, not a container. apps/ is defined as the files units deploy INTO
# containers; nothing here is copied into one.
# ==============================================================================

[engine]

# THE SINGLE LARGEST SOURCE OF LOG IN THIS STACK, AND IT SAYS NOTHING.
#
# Podman emits one health_status event per healthcheck, per container, carrying
# the image's whole label set - 3.8 KB each. Measured on 2026-08-14: 34,738
# events a day, 47.3% of ALL journal bytes over a 3-hour full-field export, and
# in the steady state every one of them says "healthy".
#
# stacks/README.md already tuned the health INTERVAL down to 60s (120s for the
# Tdarr nodes) for exactly this reason. That helped and was not enough; this
# removes the events instead.
#
# WHAT THIS COSTS, because it is a real trade rather than a free win: there is
# no longer a journal record of the moment a container flips unhealthy. Three
# things already cover that, which is why it is acceptable:
#
#   - Notify=healthy is unaffected. It is sd_notify, not the event log, so
#     podman-auto-update still restores the previous image when a new one comes
#     up broken - the rollback stacks/README.md depends on.
#   - podman inspect retains the last 5 check results, with their output.
#   - bin/verify-host.sh checks `podman ps --filter health=unhealthy` hourly.
#
# Every LIFECYCLE event survives and those are the ones worth keeping: create,
# start, died, stop, oom, pull, auto-update, remove.
#
# podman info does NOT expose this setting, so bin/verify-host.sh cannot read it
# back. It proves the setting empirically instead, by counting the events this
# line is supposed to have stopped - the same argument as the nightly off-site
# delete-probe. Sixteen containers on a 60s interval would put ~960 events in a
# one-hour window; zero is the proof.
healthcheck_events = false
