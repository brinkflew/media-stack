# ==============================================================================
# How much log this host keeps, and for how long
# ------------------------------------------------------------------------------
# DEPLOYED TO /etc/systemd/journald.conf.d/10-media-stack.conf. This copy is the
# reviewable one; it cannot be symlinked there, because journald is parsed by
# PID 1 and SELinux will not let PID 1 read var_t. See host/greenboot/README.md
# for what that failure looks like - systemctl cat prints the file happily, no
# AVC is logged, and nothing works.
#
# Until 2026-08-15 there was no journald configuration in this repository at
# all. The host ran on uCore's Storage=persistent and inherited defaults for
# everything else, which meant the answer to "how long do we keep logs" was
# "10% of /var, capped at 4 GB, so about three weeks" - true, undeclared, and
# unverified. bin/verify-host.sh now asserts these values are in force.
#
# 90 DAYS IS THE POLICY. SystemMaxUse is the runaway backstop, not the thing
# that should bite: at the measured rate 90 days is 10-13 GB of the 186 GB free
# on /var, so the size cap only fires if something starts screaming.
#
# ONE BUDGET COVERS BOTH JOURNALS. system.journal and user-1000.journal live in
# the same directory (/var/log/journal/<machine-id>/), and journald vacuums that
# directory as a whole - so this is not 16 GB each. Worth knowing, because the
# user journal is the big one here: the containers log through it, and it was
# 376 MB of the 438 MB total.
# ==============================================================================

[Journal]
SystemMaxUse=16G
MaxRetentionSec=90d
SystemKeepFree=4G

# Vacuum granularity. The files were 64-96 MB each, so eviction happened in
# coarse jumps and "90 days" would really have meant "whatever the oldest whole
# file happens to cover". A daily boundary makes the retention figure honest.
SystemMaxFileSize=128M
MaxFileSec=1day

# Restated rather than inherited, for the same reason host/butane/ucore.bu
# restates AutomaticUpdatePolicy=stage: an inherited default can change
# underneath you. These are the CURRENT defaults written down, not a change -
# there have been no drops in the last 7 days.
#
# Worth stating specifically because journald DROPS SILENTLY when it rate
# limits. It logs one "Suppressed N messages" line and discards the rest, so
# absence of a log line stops being evidence of absence - which is why
# bin/verify-host.sh counts those lines rather than trusting this.
RateLimitIntervalSec=30s
RateLimitBurst=10000
