# ==============================================================================
# Order greenboot's health check after the things that health check asserts
# ------------------------------------------------------------------------------
# Symlinked to /etc/systemd/system/greenboot-healthcheck.service.d/10-media-stack.conf
# - see host/greenboot/README.md.
#
# greenboot-healthcheck.service is WantedBy=multi-user.target, which means it
# runs INSIDE that transaction, roughly in parallel with everything else in it -
# not after it. Without this drop-in, several assertions in verify-host.sh
# --greenboot race the units they are about:
#
#   the LAN address       NetworkManager may not have configured nic0 yet
#   firewalld's services  firewall-stack-ports.service adds http/https/8096
#   lingering             needs systemd-logind
#   the media mount       var-mnt-media.mount, and the context= it carries
#   the CDI spec          nvidia-cdi-refresh writes /run/cdi/nvidia.yaml
#
# Each of those would FAIL for a reason that has nothing to do with the
# deployment, and once this check is in required.d a FAIL reverts the OS. So the
# ordering is not tidiness, it is what stops the health check inventing faults.
#
# Ordering only, never Wants=, with the single exception of network-online.target
# which is the documented way to ask for it and which greenboot's own
# default-health-checks drop-in also pulls in. A Wants= on any of the others
# would silently ENABLE a unit that is deliberately not enabled - the trap that
# had media-stack-promote.service starting Tdarr every ten minutes.
# ==============================================================================

[Unit]
Wants=network-online.target
After=network-online.target
After=firewalld.service
After=systemd-logind.service
After=var-mnt-media.mount
After=rpm-ostreed.service
After=nvidia-cdi-refresh.service
After=firewall-stack-ports.service

[Service]
# The unit ships no TimeoutStartSec= and would inherit DefaultTimeoutStartUSec,
# which is 1min 30s here. That is the budget for EVERY check in required.d and
# wanted.d combined, and greenboot has no per-script timeout. The wrapper bounds
# its own run at 120s, so this only has to be comfortably larger than that.
TimeoutStartSec=5min
