# ==============================================================================
# GRUB boot counting - the half of greenboot that FCOS does not wire up
# ------------------------------------------------------------------------------
# COPIED to /boot/grub2/custom.cfg. Not symlinked: GRUB reads this before any
# filesystem but /boot exists, so a link into /var/home-server would not resolve.
#
# This is the body of upstream's grub2/08_greenboot.cfg, unchanged. greenboot
# installs that file to /usr/lib/bootupd/grub2-static/configs.d/, which is a
# SOURCE directory for bootupd - and /boot/grub2/grub.cfg is generated from it
# exactly once, when the machine is installed. Package layering does not
# regenerate it. So on a layered host greenboot arms a boot_counter that nothing
# ever counts down: the checks run, the journal looks healthy, and rollback
# silently cannot happen. A check that cannot fail is decorative; a rollback that
# cannot fire is worse, because the whole unattended reboot window is built on
# the belief that it will.
#
# The generated grub.cfg already ends with
#
#   ### BEGIN 41_custom.cfg ###
#   if [ -f $prefix/custom.cfg ]; then
#     source $prefix/custom.cfg
#   fi
#
# which is sourced AFTER 10_blscfg.cfg, so `set default=1` resolves against BLS
# entries that are already loaded. Ordering is the reason this works here and
# would not if the snippet were sourced earlier.
#
# `insmod increment` is satisfied on this host: the module is compiled into
# grubx64.efi. The /boot/grub2/i386-pc/increment.mod on disk belongs to the BIOS
# build and is irrelevant - this machine boots UEFI.
#
# WHAT IT DOES. boot_success is set to 0 on every boot and set to 1 by greenboot
# only after the checks pass. boot_counter is armed at shutdown by
# greenboot-set-rollback-trigger.service. So an unhealthy boot leaves
# boot_success=0, and each subsequent boot decrements the counter until it hits
# 0, at which point GRUB selects entry 1 - the previous deployment - and pins the
# counter at -1 so it does not keep falling back for ever.
#
# THIS FILE IS OUTSIDE THE PACKAGED PATH, and a future `bootupctl` static config
# regeneration would remove it. bin/verify-host.sh asserts it exists for exactly
# that reason, so its disappearance is a finding rather than a silent loss of the
# only rollback this host has.
# ==============================================================================

insmod increment
if [ -n "${boot_counter}" -a "${boot_success}" = "0" ]; then
  if  [ "${boot_counter}" = "0" -o "${boot_counter}" = "-1" ]; then
    set default=1
    set boot_counter=-1
  else
    decrement boot_counter
  fi
  save_env boot_counter
fi
set boot_success=0
save_env boot_success
