# ==============================================================================
# Three attempts across the small hours, not one
# ------------------------------------------------------------------------------
# Drop-in over podman's own /usr/lib/systemd/user/podman-auto-update.timer,
# which ships OnCalendar=daily with RandomizedDelaySec=900 - one attempt at
# ~00:00-00:15 and no second chance until the next night.
#
# ONE ATTEMPT IS THE MISTAKE home-server-reboot.timer ALREADY MADE AND FIXED.
# The reasoning transfers exactly: 30-defer-playback.conf makes the run
# conditional, the condition that actually fires is transient, and a single
# instant turns an hour-long inconvenience into a day-long one. A film that
# finishes at 00:40 should not cost the whole stack a night of updates. Refusals
# are still refusals; they simply get another look at 01:00.
#
# Two of the three are ordinarily no-ops that exit at the first gate in
# bin/update-when-idle.sh - it suppresses itself for six hours after an allowed
# run, so a quiet night runs the update once and not three times.
#
# THE HOST IS ON UTC, which is what makes this window right and is easy to read
# wrongly. `timedatectl` reports UTC, so every OnCalendar= in host/systemd/ is
# UTC while the household is Europe/Brussels - these three fire at 02:00, 03:00
# and 04:00 local in summer. That is the quietest band there is: the session
# series puts local 00:00 at 33% of samples with somebody watching and the small
# hours at effectively nothing once a single stuck overnight session is
# discounted.
#
# 00:00-02:00 UTC is also clear of everything else on the host, which is the
# other half of why the window stops where it does:
#
#   23:00  home-server-dashboard-build
#   00:00  THIS, attempt 1        rpm-ostreed-automatic stages alongside it
#   01:00  THIS, attempt 2
#   02:00  THIS, attempt 3
#   03:00  home-server-backup, +5min jitter, TimeoutStartSec=45min
#   04:30  home-server-search
#   05:00  home-server-reboot window opens, Sundays
#
# A fourth attempt at 03:00 would restart containers underneath restic, which is
# a partial snapshot and a lock in the off-site repository -
# bin/reboot-when-staged.sh refuses for that exact reason and this must not
# create the situation that gate exists to avoid.
#
# THE EMPTY ASSIGNMENT IS LOAD-BEARING, the same way it is in
# 10-home-server.conf. OnCalendar= is a list directive: systemd APPENDS unless
# the list is cleared first, so without the bare line podman's `daily` survives
# and this adds three attempts to it rather than replacing it.
#
# The jitter drops from podman's 900s to 10min so it stays well inside the
# hourly gap and the three attempts cannot collide or reorder - the same bound,
# for the same reason, as home-server-reboot.timer's five.
#
# Persistent=true is left as podman ships it. A missed night should be caught
# up: unlike a reboot, an update has no "next week is fine" about it.
#
# Symlinked into ~/.config/systemd/user/ as a DIRECTORY - see
# host/systemd/README.md, whose loop had to learn *.timer.d for this.
# ==============================================================================

[Timer]
OnCalendar=
OnCalendar=*-*-* 00,01,02:00
RandomizedDelaySec=10min
AccuracySec=1min
