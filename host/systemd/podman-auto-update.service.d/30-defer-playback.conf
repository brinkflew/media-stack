# ==============================================================================
# Do not update through somebody's film
# ------------------------------------------------------------------------------
# Third drop-in over podman's own
# /usr/lib/systemd/user/podman-auto-update.service. 10-home-server.conf makes
# the housekeeping prune non-fatal, 20-snapshot-databases.conf puts a restore
# point in front of the update, and this one decides whether tonight is the
# night at all.
#
# WHAT IT IS FOR. Jellyfin follows :latest, so an auto-update run recreates it
# whenever the image moves - and on 2026-08-19 at 00:20:30 that happened while
# somebody was mid-stream. The series has the whole thing: three connected
# sessions and one playing before, a gap where the collector could not reach
# Jellyfin at all, then playing=0 total=0, then a single client resuming. Two
# never came back. bin/update-when-idle.sh carries the timeline.
#
# ExecCondition=, NOT ExecStartPre=, AND THE DIFFERENCE IS THE WHOLE POINT. A
# non-zero ExecStartPre= FAILS the unit; a non-zero ExecCondition= (1-254)
# SKIPS it and leaves it not failed. A deferral is a decision, not a fault, and
# a unit sitting red on a night when everything worked correctly is how people
# stop reading unit states - the same argument home-server-reboot.service makes
# for exiting 0 when it declines to reboot.
#
# 255 or a signal still fails, which is the property that keeps this from being
# a silencer: the gate crashing is distinguishable from the gate refusing.
#
# IT RUNS BEFORE ExecStartPre=, so a deferred night skips the database snapshot
# too. That is correct rather than incidental - the snapshot exists to sit
# immediately in front of an update, and on a deferred night there is no update
# for it to sit in front of. It runs in full on whichever attempt is allowed.
#
# THE REFUSAL IS NOT UNLIMITED, and the ceiling is in the script rather than
# here: past three days of deferral playback stops being a veto. See
# bin/update-when-idle.sh for why three rather than the encoder gate's fourteen,
# and host/systemd/podman-auto-update.timer.d/30-retry-window.conf for the two
# extra attempts that make a refusal cost an hour rather than a day.
#
# Symlinked into ~/.config/systemd/user/ as a DIRECTORY - see
# host/systemd/README.md. Adding a file here needs no new symlink.
# ==============================================================================

[Service]
ExecCondition=/var/home-server/bin/update-when-idle.sh
