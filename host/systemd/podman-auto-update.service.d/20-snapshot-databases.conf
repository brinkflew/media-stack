# ==============================================================================
# Snapshot the databases before anything is updated
# ------------------------------------------------------------------------------
# Second drop-in over podman's own
# /usr/lib/systemd/user/podman-auto-update.service. 10-home-server.conf makes
# the housekeeping prune non-fatal; this one puts a restore point in front of
# the update itself.
#
# THE ROLLBACK RESTORES THE IMAGE AND CANNOT UN-MIGRATE THE DATABASE. That is
# not a shortcoming of podman - there is nothing it could do - but it means the
# safety net has a hole exactly where this stack is most exposed, because most
# of these applications migrate a schema on startup. Pocket ID fell through it
# on 2026-08-19 and took every sign-on in the stack down for nine and a half
# hours. bin/pre-update-snapshot.sh carries the full account.
#
# ORDERING IS WHY THIS IS A DROP-IN RATHER THAN A TIMER. It has to run in the
# same job as the update, immediately before it, or it is just another nightly
# snapshot at a different time - and the nightly backup at 03:00 already exists
# and is 21 hours stale by the time the updater fires at ~00:00.
#
# NO `-` PREFIX, DELIBERATELY. A failed snapshot aborts the whole unit and
# podman auto-update never runs: a night without container updates is
# recoverable, a rollback with nothing to restore from is what this exists to
# prevent. Note the asymmetry with 10-home-server.conf, which adds `-` to the
# prune - that one can be skipped at no cost, this one cannot.
#
# It costs one SQLite backup pass over config/. The shadow tree persists between
# runs, so after the first night only changed pages are written.
#
# Symlinked into ~/.config/systemd/user/ as a DIRECTORY - see
# host/systemd/README.md. Adding a file here needs no new symlink.
# ==============================================================================

[Service]
ExecStartPre=/var/home-server/bin/pre-update-snapshot.sh
