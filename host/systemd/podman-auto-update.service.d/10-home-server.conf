# ==============================================================================
# Stop opportunistic housekeeping from failing the unit that updates the stack
# ------------------------------------------------------------------------------
# Drop-in over podman's own /usr/lib/systemd/user/podman-auto-update.service,
# which ships:
#
#   ExecStart=/usr/bin/podman auto-update
#   ExecStartPost=/usr/bin/podman image prune -f
#
# THE TWO HALVES HAVE VERY DIFFERENT WEIGHT AND THE UNIT TREATED THEM ALIKE.
# ExecStart is the nightly update of eighteen containers, protected by
# Notify=healthy so a broken image is rolled back. ExecStartPost is a disk
# reclaim that can be skipped for a night at no cost. As shipped, the second
# failing marks the whole unit failed - so `podman auto-update` exits 0, every
# container updates correctly, and systemd reports the updater broken.
#
# That is not hypothetical. On 2026-08-17 and 2026-08-18 this unit failed with:
#
#   Main PID: ... (code=exited, status=0/SUCCESS)          <- the update, fine
#   Control process exited, code=exited, status=125/n/a    <- the prune
#   Error: image used by 06fc6c080d43...: image is in use by a container
#
# A .build unit interrupted mid-run leaves a buildah working container in
# storage. It holds the build-cache layer it was made from, so that image is
# both dangling and in use, and `podman image prune -f` exits 125 rather than
# skipping it. Seven had accumulated. The visible signal was
# containers.failed_units naming podman-auto-update.service - three scripts away
# from the cause, and pointing at the one component that was working.
#
# THE EMPTY ASSIGNMENT IS LOAD-BEARING. ExecStartPost= is a list directive:
# systemd APPENDS unless the list is cleared first, so a drop-in carrying only
# the `-` form leaves the original fatal line in place and ahead of it, and
# changes nothing. Clearing then re-adding is the whole idiom.
#
# `-` makes a non-zero exit non-fatal. It does NOT make it invisible - the error
# is still journalled - and the condition behind it is now measured directly by
# containers.storage_orphans in bin/verify-host.sh, which WARNs and names the
# remedy. That check is what makes this drop-in a correction rather than a
# silencer. DO NOT REMOVE ONE WITHOUT THE OTHER.
#
# Still `prune -f` and never `prune -a`: a superseded image keeps its repository
# digest and so is not dangling, which is why the previous image survives to be
# the rollback. See CLAUDE.md, "the nightly prune does not eat the rollback".
#
# Symlinked into ~/.config/systemd/user/ as a DIRECTORY - see
# host/systemd/README.md.
# ==============================================================================

[Service]
ExecStartPost=
ExecStartPost=-/usr/bin/podman image prune -f
