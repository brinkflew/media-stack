# =============================================================================
# Alerting rules
# -----------------------------------------------------------------------------
# Loaded by apps/prometheus/prometheus.yml from the same read-only mount, so a
# change deploys like everything else: commit, `git pull`,
# `systemctl --user reload prometheus`. Check them BEFORE deploying - a
# malformed file makes the reload fail and silently leaves the old rules
# running, which is safe but is not what you asked for:
#
#   podman exec prometheus promtool check rules /etc/prometheus/rules/*.yml
#
# TWO CONVENTIONS HOLD THROUGHOUT.
#
# `severity` is critical or warning and nothing else. Alertmanager routes on
# it, the bridge maps it to an ntfy priority, and a third value would silently
# fall through to the default route at default priority - visible nowhere.
#
# EVERY ALERT NAMES WHAT TO DO, not just what is true. An alert whose whole
# content is a metric name and a number costs the reader the entire diagnosis
# at the moment they are least able to do it, and that is how a channel stops
# being read. `summary` says what happened; `description` says where to look.
# =============================================================================

groups:
  # ===========================================================================
  # Who watches the watchman
  # ---------------------------------------------------------------------------
  # THIS GROUP IS NOT OPTIONAL AND IT IS FIRST FOR A REASON. Every rule below
  # it reads a series that arrives through node-exporter's textfile collector.
  # If the collector stops, or the scrape stops, those series simply stop
  # existing - and a rule whose expression matches nothing does not fire. The
  # whole battery goes quiet, and quiet is exactly what healthy looks like.
  #
  # This is the same trap bin/verify-host.sh documents about its own timer, and
  # the same one behind the deliberate absence of a `home_server_collector_up 1`
  # sample: a metric that asserts liveness can only be written by something
  # alive, so it reads green for ever after the writer dies.
  # ===========================================================================
  - name: pipeline
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
          description: >-
            Every home_server_* series arrives through node-exporter. While
            this is down the rest of these rules cannot fire at all, so treat
            silence from them as unknown rather than healthy.
            `systemctl --user status node-exporter prometheus`.

      - alert: MetricsCollectorStale
        # The collector runs every 30s and stamps its own success into the
        # textfile it produces, so the last value present is by construction
        # the last success. 10 minutes is twenty missed runs.
        #
        # NOT home_server_metrics_last_ok_timestamp_seconds, WHICH IS A
        # DIFFERENT CLOCK. That one is a fact lifted out of status.json, so it
        # is only refreshed when bin/verify-host.sh runs - hourly. Against a
        # 600s threshold it crosses on every single cycle, and this rule fired
        # four times in its first hour before the names were told apart. Two
        # metrics, both plausibly named, one of them measuring the wrong thing:
        # the same trap as badges.providers under "providers currently usable".
        expr: time() - home_server_collector_last_success_timestamp_seconds > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "bin/collect-metrics.py has not succeeded for 10 minutes"
          description: >-
            node-exporter is still up, so host vitals continue - but every
            home_server_* series is frozen at its last value, which on a graph
            is indistinguishable from a stable system.
            `journalctl --user -u home-server-metrics -n 50`.

      - alert: VerifyBatteryStale
        # Hourly timer; two hours is one missed run plus margin.
        expr: time() - home_server_verify_last_run_timestamp_seconds > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The health battery has not run for two hours"
          description: >-
            home_server_check_status is frozen, so CheckFailing below cannot
            fire on anything new. `systemctl --user status home-server-verify`.

      - alert: AlertDeliveryFailing
        # Prometheus failing to hand alerts to Alertmanager. NOTE WHAT THIS
        # CANNOT DO: if the delivery path is broken, this alert cannot reach
        # the phone either. It fires so that it is recorded and so that it
        # arrives the moment delivery recovers; the channel that actually
        # covers a dead notifier is the MOTD and container health.
        expr: increase(prometheus_notifications_errors_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot deliver alerts to Alertmanager"
          description: >-
            Alerts are being evaluated and dropped. Nothing else in this file
            can reach you while it is true. Check alertmanager, then
            ntfy-alertmanager, then ntfy - in that order, it is the direction
            the alert travels.

      - alert: AlertBridgeFailing
        # THE HOP THAT NOTHING WATCHED. AlertDeliveryFailing above covers
        # Prometheus -> Alertmanager, and the chain is four hops long:
        # Prometheus -> Alertmanager -> ntfy-alertmanager -> ntfy -> phone.
        # Everything past the first hop was unmeasured, and the failure mode is
        # documented right there in apps/alertmanager/alertmanager.yml: a
        # password_file naming the read-only mount, where "every container stays
        # healthy, both configs validate, Prometheus is happy, and each
        # notification fails with a 401 that only appears in Alertmanager's own
        # log". This is that 401, as a series.
        #
        # It also covers the case that made the 2026-08-19 outage impossible to
        # reconstruct afterwards: ntfy-alertmanager does not log a webhook it
        # receives, so its journal cannot say whether a page was delivered. This
        # can.
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager cannot reach the ntfy bridge"
          description: >-
            Alerts are grouped and then dropped on the last hop, so nothing in
            this file reaches the phone. Most likely the rendered credential at
            /alertmanager/webhook.pw - a 401 shows only in Alertmanager's log.

      - alert: Watchdog
        # A DEAD MAN'S SWITCH, and the only thing here that can prove the chain
        # end to end. Every other rule proves itself by firing; none of them can
        # prove that a SILENT phone means a healthy stack rather than a broken
        # notifier. This one always fires, so its arrival each day is the proof
        # and its absence is the finding.
        #
        # BE HONEST ABOUT WHAT IT COSTS AND WHAT IT CANNOT DO. It is delivered
        # through the same path it is testing, so it cannot alert on its own
        # failure - a human noticing it stopped is the detector, which is weaker
        # than every other rule here. The external alternative is a third-party
        # cron-monitor holding a URL for this host, and that was not wanted.
        # priority 2 in the bridge: it appears in the notification shade without
        # a sound, once a day.
        expr: vector(1)
        labels:
          severity: heartbeat
        annotations:
          summary: "Alerting is alive"
          description: >-
            Sent once a day through the whole chain. If this stops arriving,
            the chain is broken - not the stack quiet. Check alertmanager, then
            ntfy-alertmanager, then ntfy, in that order.

      - alert: CollectorClientUnavailable
        # AN APPLICATION THE COLLECTOR CANNOT POLL AT ALL, which is a different
        # thing from one that answered with nothing - and the reason this rule
        # exists is that the difference was invisible for months.
        #
        # api_get shelled `curl` inside the target container, and gluetun and
        # jellyseerr ship only wget. Every call against them returned None, each
        # caller guards with `if isinstance(x, dict)`, and so
        # home_server_vpn_info was NEVER ONCE EMITTED while the source kept
        # completing and kept writing source_up 1. Same shape as the shellcheck
        # leg that reported "all checks passed" over 2,224 lines it never read.
        #
        # It belongs in THIS group rather than under degradation because it is a
        # failure of the measuring apparatus, not of the thing measured: every
        # series that endpoint would have produced is silently absent, and an
        # absent series makes every other rule about it unfireable.
        expr: home_server_collector_client_unavailable > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} container(s) have no HTTP client the collector can use"
          description: >-
            An application endpoint cannot be polled at all, so its series are
            absent rather than zero - and nothing else here can alert on a series
            that does not exist. The container name is on stderr:
            `journalctl --user -u home-server-metrics -n 50`.

  # ===========================================================================
  # The battery
  # ===========================================================================
  - name: battery
    rules:
      - alert: CheckFailing
        # ONE RULE COVERS ALL 92 CHECKS AND EVERY FUTURE ONE, because a new
        # check joins home_server_check_status automatically. The id label is
        # stable by charter - bin/verify-host.sh guarantees it and lint-repo.sh
        # asserts uniqueness - while the prose is explicitly not, which is why
        # this alerts on the id and sends the reader to the message rather than
        # trying to carry it.
        expr: home_server_check_status == 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Health check {{ $labels.id }} is FAILING"
          description: >-
            Section {{ $labels.section }}. The wording lives in status.json,
            not here: `jq -r '.checks[]|select(.id=="{{ $labels.id }}")'
            /var/lib/home-server/status.json`.

      - alert: OsImageStale
        # THE ONE WARN THAT HAS TO NOTIFY, which is why it needs a rule of its
        # own: CheckFailing is `== 3` and this check is deliberately a WARN. It
        # cannot be a FAIL, because bin/reboot-host.sh and
        # bin/reboot-when-staged.sh both refuse on an unhealthy battery and a
        # stalled updater is not something a reboot fixes - so a FAIL here would
        # block the OS security updates it is complaining about not getting.
        #
        # 6h rather than 30m because staged-but-not-applied is the normal state
        # between the nightly stage and the Sunday reboot window, and this check
        # compares against the STAGED digest when one exists. Firing sooner
        # would alert on the system working as designed.
        expr: home_server_check_status{id="deploy.image_digest"} == 2
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "A newer OS image is published and nothing has staged it"
          description: >-
            rpm-ostree can report "No updates available" with an update waiting -
            observed 2026-08-17, after a `cleanup -r` removed a staged
            deployment. `sudo rpm-ostree upgrade` is the first thing to try;
            failing that, re-resolve the ref with `rpm-ostree rebase` to the
            same image. The digests are in status.json under facts.

  # ===========================================================================
  # Units and containers
  # ===========================================================================
  - name: containers
    rules:
      - alert: ContainerUnhealthy
        # 0 healthy, 1 starting, 2 unhealthy - and ABSENT where no health check
        # is defined, which is what stops duckdns and unpackerr firing this for
        # ever. Those two serve no HTTP and report no health, and a rule that
        # assumed every container has a status would call them broken
        # permanently. CLAUDE.md names that mistake explicitly.
        expr: home_server_container_health == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} is unhealthy"
          description: >-
            It is running but failing its own health check, so systemd still
            calls the unit active. `podman inspect {{ $labels.container }}
            --format '{{ "{{" }}json .State.Health{{ "}}" }}'` keeps the last
            five results with their output.

      - alert: UnitRestartLoop
        # THIS RULE COULD NOT FIRE FOR AS LONG AS IT EXISTED. It read
        # home_server_container_restarts_total, which is podman's per-container
        # Restarts field - and a quadlet RECREATES the container on every
        # restart, so the counter resets each time round the loop. It read 0
        # through all 6,224 of pocket-id's restarts on 2026-08-19, during the
        # nine and a half hours it was built to catch.
        #
        # home_server_unit_restarts_total is systemd's NRestarts, which belongs
        # to the unit rather than the container and therefore survives. Keyed on
        # kind so the oneshot .build and .network units cannot contribute.
        expr: >-
          increase(home_server_unit_restarts_total{kind=~"container|pod"}[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.unit }} has restarted repeatedly"
          description: >-
            A unit stuck restarting is usually Restart=always plus a failure at
            startup, not slow progress. Read the journal rather than waiting -
            the real error scrolls past between restarts. Since 2026-08-19 the
            unit gives up after ~100s and lands in `failed`; if it is still
            looping, something is restarting it from outside.

      - alert: UpdateRolledBack
        # A THIRD WARN THAT HAS TO NOTIFY, for the reason OsImageStale and
        # ProbeBinaryMissing already give: CheckFailing is `== 3` and this check
        # is a WARN whenever the affected unit has recovered on its own.
        #
        # The FAIL half - the service still not active - is carried by
        # CheckFailing and needs nothing here. This covers the quieter half: an
        # upstream image was published that cannot run on this host, podman put
        # the old one back, and everything now reads green. Nothing else would
        # ever mention it, and it will be offered again at midnight.
        expr: home_server_check_status{id="update.rollback"} == 2
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The last container update rolled back"
          description: >-
            An image would not go healthy and the previous one was restored.
            The stack is running, on yesterday's image, and tonight's run will
            try the same one again. `jq -r '.checks[]|select(.id=="update.rollback")'
            /var/lib/home-server/status.json`.

      - alert: ProbeBinaryMissing
        # A SECOND WARN THAT HAS TO NOTIFY, for the same reason OsImageStale
        # does: CheckFailing is `== 3` and containers.probe_binaries is
        # deliberately a WARN, because bin/reboot-host.sh refuses to act on an
        # unhealthy battery and a missing probe binary is not something a
        # reboot fixes.
        #
        # THIS IS THE ONE THAT COSTS SIGN-ON IF IT IS MISSED. Pocket ID 2.14.0
        # dropped `curl`; its probe exited 127 against a healthy application,
        # Notify=healthy never fired, and podman auto-update rolled the image
        # back into a schema it could no longer read - nine and a half hours
        # with no sign-on anywhere in the stack. Eighteen quadlets still probe
        # with curl or wget and NONE of those images declares a healthcheck of
        # its own, so the exposure cannot be removed, only watched.
        #
        # 1h rather than 30m, and it is not tuning: the condition only bites at
        # the nightly update, so an hour of grace costs nothing and keeps a
        # container restarting mid-pull from firing this.
        expr: home_server_check_status{id="containers.probe_binaries"} == 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "A health probe invokes a binary its image no longer ships"
          description: >-
            The probe will exit 127 against an application that is up, and
            podman auto-update will roll the image back on the next nightly
            run - into a database the newer image may already have migrated.
            status.json names the container and the binary:
            `jq -r '.checks[]|select(.id=="containers.probe_binaries")'
            /var/lib/home-server/status.json`. Fix it before 00:00.

  # ===========================================================================
  # Backups
  # ---------------------------------------------------------------------------
  # The thresholds match bin/verify-host.sh deliberately. Two sources of truth
  # disagreeing about when a backup is stale is worse than either alone.
  # ===========================================================================
  - name: backups
    rules:
      - alert: BackupStale
        expr: time() - home_server_backup_local_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The local backup is more than 48 hours old"
          description: >-
            config/ is the only part of this system that cannot be rebuilt from
            git. `journalctl --user -u home-server-backup -n 50`.

      - alert: BackupOffsiteStale
        expr: time() - home_server_backup_offsite_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The off-site backup is more than 48 hours old"
          description: >-
            The local copy shares a disk with config/ and does not survive it.
            This is the copy that survives the machine.

      - alert: BackupPolicyProofStale
        # NOT "the policy is broken" - "we have not proved it is intact". The
        # nightly probe records a marker only on a CONFIRMED refusal, so a
        # timeout or a DNS failure leaves the old marker rather than claiming
        # either outcome. One unreachable night reads as stale; a real
        # regression surfaces on the second.
        expr: time() - home_server_backup_offsite_policy_ok_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The append-only backup policy has not been proved for 48 hours"
          description: >-
            The nightly probe writes a 0-byte object outside locks/ and expects
            the delete to be refused. This does not mean the policy failed - it
            means it has not been confirmed. A policy that silently stops
            working looks exactly like one that works.

      - alert: RestoreNeverProven
        # KEYED ON THE CHECK, NOT ON THE TIMESTAMP, and that is the whole point.
        # Every other rule in this group reads a marker's age - which requires
        # the marker to EXIST. The state this one has to cover is a marker that
        # was never written at all, where there is no series to subtract from
        # time() and a staleness rule stays silent for ever on the one host that
        # has never verified a restore.
        #
        # bin/verify-host.sh already resolves both cases into one WARN, so
        # reading its status covers "overdue" and "never" together. And WARN is
        # why this rule has to exist: CheckFailing is `== 3`, the same gap
        # OsImageStale, ProbeBinaryMissing and UpdateRolledBack each needed
        # their own rule for.
        expr: home_server_check_status{id=~"backup.restore_(local|offsite)_age"} == 2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} - the backups are not proven to restore"
          description: >-
            A backup is not proven until it has been restored. Run
            `./bin/verify-restore.sh` from the workstation, and
            `--repo offsite --deep` for the copy that survives the disk.

      - alert: BackupTsdbSnapshotStale
        expr: time() - home_server_backup_tsdb_snapshot_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The metrics store has not been snapshotted for 48 hours"
          description: >-
            Only the metrics history is at risk, not config/ - hence warning.
            A live TSDB cannot be rsynced, so this snapshot is the only way it
            reaches the backup.

      - alert: PreUpdateSnapshotStale
        # THE RESTORE POINT THE ROLLBACK CANNOT PROVIDE. podman auto-update
        # restores the image and cannot un-migrate the database, so
        # bin/pre-update-snapshot.sh runs as ExecStartPre= on
        # podman-auto-update.service at ~00:00 - 21 hours newer than the 03:00
        # backup, which is the gap Pocket ID fell through on 2026-08-19.
        #
        # THE QUIET FAILURE THIS IS FOR: the drop-in not being wired at all, on
        # a rebuilt host where host/systemd/README.md's symlink loop was not
        # re-run. Then the updater runs normally, every container updates, and
        # the only protection against a bad rollback is silently absent. If the
        # UPDATER stopped instead, update.podman_run already says so and says
        # it better.
        #
        # 48h to match the updater's own ceiling in bin/verify-host.sh, so one
        # missed night reads as stale rather than as broken.
        expr: time() - home_server_backup_pre_update_db_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No database snapshot has been taken before a container update"
          description: >-
            An unattended update can no longer be undone: a rollback restores
            the image and leaves a migrated schema behind it. Check that
            ~/.config/systemd/user/podman-auto-update.service.d is symlinked to
            host/systemd/podman-auto-update.service.d and that
            bin/pre-update-snapshot.sh runs.

  # ===========================================================================
  # Degradation
  # ---------------------------------------------------------------------------
  # Everything here is a warning, and the thresholds are deliberately slack.
  # These conditions are real but slow, and several of them flap - an indexer
  # or a subtitle provider backing off for an hour is ordinary. The failure
  # mode being designed against is not missing one, it is sending enough of
  # them that the critical ones stop being read.
  # ===========================================================================
  - name: degradation
    rules:
      - alert: SubtitleProvidersAllDown
        # NOT per-provider. Any single provider throttling is routine - a free
        # daily quota runs out most days. The condition that actually matters
        # is that none is usable, which is the state Bazarr was in for months
        # with one provider configured, logging "All providers are throttled"
        # while every container stayed healthy.
        expr: sum(home_server_subtitle_provider_up) == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Every subtitle provider is unusable"
          description: >-
            Bazarr is doing nothing at all, not working slowly. Usually a
            provider quota; check for "All providers are throttled" in
            config/bazarr/log/bazarr.log and consider enabling another.

      - alert: IndexersMostlyDown
        # Threshold rather than any-indexer, for the reason above. Individual
        # indexers back off constantly and most of the causes are somebody
        # else's site being down.
        expr: >-
          sum(home_server_indexer_up) / count(home_server_indexer_up) < 0.5
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "More than half of the indexers are backing off"
          description: >-
            Searching is degraded while everything looks healthy - this signal
            exists precisely because nothing else shows it. Read the Prowlarr
            log before assuming a local cause; measured on 2026-08-15 the
            causes were a dead mirror, duplicate entries and two sites down.

      - alert: FilesystemFillingUp
        expr: >-
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is below 10% free"
          description: >-
            /var carries the OS, the checkout, config/ and /var/backups on one
            233 GB partition. /boot is 350 MB and cannot be grown - if that is
            the one filling, check for a pinned deployment first.

      - alert: FilesystemAlmostFull
        expr: >-
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is below 5% free"
          description: >-
            At this point the backup, the metrics store and the databases are
            all at risk of a write failure.

      - alert: DiskHealthFailing
        # SMART's own overall verdict. It is conservative to the point of being
        # late, so a zero here is never a false alarm.
        expr: home_server_disk_health_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "SMART reports {{ $labels.device }} as failing"
          description: >-
            /mnt/media has no redundancy and is deliberately not backed up. If
            this is nvme0 it carries config/ and the local backup, and the
            off-site copy is the one that matters.

      - alert: GpuHot
        expr: home_server_gpu_temperature_celsius > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} has been over 85C for 15 minutes"
          description: >-
            Sustained rather than a transcode spike. Check airflow and whether
            two NVENC sessions are running against a queue that is not draining.
