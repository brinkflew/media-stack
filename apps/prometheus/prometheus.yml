# ==============================================================================
# Prometheus scrape configuration
# ------------------------------------------------------------------------------
# Tracked in git and bind-mounted read-only at /etc/prometheus, as a DIRECTORY
# rather than a single file, so that a `git pull` replacing this does not leave
# the container holding a stale inode. The same contract apps/caddy has.
#
# Editing the copy on the server is pointless; it is a read-only mount of the
# checkout. Change it here, commit, `git pull`, then reload without a restart:
#
#   systemctl --user reload prometheus
#
# PORTS ARE WRITTEN OUT, NOT PARAMETERISED. Prometheus does no environment
# substitution in this file - ${VAR} is not expanded, and there is no include
# mechanism - so a variable here would silently be a literal string. See
# stacks/infra/prometheus.container for the same note from the other side.
#
# Targets are addressed by container name over net-metrics. Nothing is scraped
# through Caddy: that would make every metric depend on the health of the one
# component you most want metrics about, and would put 2,800 scrapes a day into
# the access log that exists to show scanners walking the *arr APIs.
# ==============================================================================

global:
  # 30s is chosen against the rate of change of the fastest thing measured here,
  # which is encoder utilisation during a transcode. It is NOT free: halving it
  # doubles the samples, and the cardinality budget is the thing that keeps this
  # store smaller than config/. See CLAUDE.md, "Logs and status".
  scrape_interval: 30s
  scrape_timeout: 10s
  # How often the rules below are evaluated. Deliberately equal to the scrape
  # interval: evaluating faster than the data arrives only re-reads the same
  # sample, and evaluating slower delays every `for:` clause by an unpredictable
  # amount.
  evaluation_interval: 30s

# Loaded from the same read-only mount as this file, so a rule change deploys
# the same way everything else here does - commit, `git pull`,
# `systemctl --user reload prometheus`. A malformed rule file makes the reload
# FAIL and leaves the previous rules running, which is the behaviour you want:
# check `promtool check rules` before deploying, and read the reload's exit
# code rather than assuming.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus watching itself is not a liveness check - if it is down, nothing
  # here runs and nothing is recorded. It is scraped for prometheus_tsdb_*,
  # which is where the cardinality and on-disk size that bin/verify-host.sh
  # grades actually come from. Liveness is asserted from outside, by
  # verify-host.sh and by the MOTD.
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Host vitals, plus everything bin/collect-metrics.py writes into the textfile
  # directory - so home_server_* series arrive under this job too. That is
  # deliberate: the textfile collector is the delivery path, and it brings
  # node_textfile_mtime_seconds with it, which is how a stopped collector
  # becomes visible without the collector having to claim it is running.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # THE LAST HOP, WHICH WAS UNMEASURED UNTIL 2026-08-19. Alertmanager appears
  # above under `alerting:` and that is a DIFFERENT relationship - it makes it
  # somewhere to send alerts to, not something to collect from. So the whole
  # chain past Prometheus was invisible: alertmanager_notifications_failed_total
  # is exactly the 401-against-the-read-only-mount that alertmanager.yml warns
  # about in its own comments, and it existed nowhere anything could read it.
  #
  # It is also what made the 2026-08-19 outage impossible to reconstruct.
  # ntfy-alertmanager does not log the webhooks it receives, so after four
  # critical alerts had been firing for eight and a half hours there was no
  # record on this machine of whether a single one had been delivered. There is
  # now.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
