# =============================================================================
# The parts of Jellyfin's encoding configuration that are decisions, not defaults
# -----------------------------------------------------------------------------
# Rendered into config/jellyfin/encoding.xml by bin/render-jellyfin-encoding.py,
# from an ExecStartPre= on jellyfin.container. ONLY the keys listed here are
# written; every other element in that document is left exactly as Jellyfin
# wrote it. Same contract as apps/jellyfin/custom.css: git is authoritative, so
# an edit made in the dashboard survives until the next restart and then
# reverts - and podman-auto-update restarts Jellyfin nightly.
#
# encoding.xml was gitignored runtime state until 2026-08-15. CLAUDE.md has
# named that as an open gap for a while; the Backrooms subtitle-drift
# investigation is what made the cost concrete, because diagnosing it depended
# entirely on settings that existed nowhere a `git grep` could reach and that a
# restore from an older backup would have silently changed underneath us.
#
# Syntax: Element = value, one per line, # for comments. Element[] = a,b,c writes a
# list of <string> children instead - the [] is required, because an emptied list
# is written <Foo /> and cannot be told apart from a scalar by looking.
# =============================================================================

# HOW JELLYFIN SEGMENTS AN MKV FOR A BROWSER, and the reason this whole file
# exists. On the stream-copy path Jellyfin builds its HLS playlist from a real
# keyframe index for the extensions listed here, which is what makes seeking
# accurate. Keep it: the alternative is a uniform 6s grid that an irregular GOP
# mismatches just as badly, in the other direction. The actual fix for drift is
# a regular keyframe interval at encode time - see the keyframeSeconds input on
# apps/tdarr/plugins/Tdarr_Plugin_avs1_MediaStackStreamPolicy.js, and
# bin/verify-media.sh for whether a given file has one.
AllowOnDemandMetadataBasedKeyframeExtractionForExtensions[] = mkv

# LEFT ON DELIBERATELY, having been suspected and cleared. Throttling pauses the
# ffmpeg job once it is ThrottleDelaySeconds ahead of the playhead ("Transcoding
# is paused. Press [u] to resume." in the FFmpeg.* logs). It was the first
# suspect for the Backrooms drift and it is not the cause: pausing and resuming
# a process does not move a timestamp, and the drift is measurable inside one
# uninterrupted session. Turning it off would cost transcode disk and GPU time
# and fix nothing.
EnableThrottling = true
ThrottleDelaySeconds = 180

# Segments are kept for the life of the job rather than deleted behind the
# playhead. This is what made the Backrooms diagnosis possible at all - the
# stale .m3u8 and its fragments were still on disk hours later, which is how
# ffmpeg's real segment durations could be compared against what Jellyfin had
# advertised. It costs a few hundred MB of config/data/transcodes.
EnableSegmentDeletion = false

# GPU 1. GPU 0's video engines are dead hardware - see stacks/media/jellyfin.container.
HardwareAccelerationType = nvenc
EnableHardwareEncoding = true
AllowHevcEncoding = true

# Hardware DECODING was never off, despite a grep making it look empty: a
# line-matching grep prints <HardwareDecodingCodecs> and </HardwareDecodingCodecs>
# on adjacent lines and hides the <string> children between them. Pinned here so
# the list is readable in git rather than only through the API.
HardwareDecodingCodecs[] = h264,hevc,vc1,av1,vp9,vp8,mpeg2video
