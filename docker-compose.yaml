# ==============================================================================
# Docker Compose File: Global
#
#   Author:   brinkflew <antoine.van.serveyt@gmail.com>
#   Created:  March 08, 2023
#   Revision: 1.0.0
# ------------------------------------------------------------------------------
# Setup containers and startup in predefined order to account for dependencies.
# Parameters are defined in the `.env` file next to this one hence you should
# not need to edit this configuration.
# ==============================================================================

# ------------------------------------------------------------------------------
# Networking
# ------------------------------------------------------------------------------
# One network per trust boundary, rather than the single shared bridge this
# started as. On a flat bridge every container reaches every other by name,
# which bypasses Caddy and therefore bypasses single sign-on entirely - the
# applications' own logins were the only thing standing in the way.
#
# The edges below were read out of the running configuration, not assumed: the
# *arr download-client and indexer settings, Prowlarr's applications and indexer
# proxies, and Jellyseerr's settings.json. A service joins a network only where
# something actually has to talk to it.
#
# Caddy joins each segment individually. A single shared "proxy" network holding
# everything with a UI would just re-flatten the topology and buy nothing.
#
# Docker blocks traffic between bridges in its DOCKER-ISOLATION-STAGE-2 chain,
# so "no shared network" means "no route", not merely "no DNS name". Verify a
# forbidden edge by IP, not only by name resolution.
#
# The downloaders appear in none of these. They have no network stack of their
# own - see the note on gluetun below.
# ------------------------------------------------------------------------------

networks:

  # Caddy and the sign-on pair. Nothing else has any business reaching the
  # identity provider. TRUST_PROXY and TINYAUTH_AUTH_TRUSTEDPROXIES are pinned
  # to this subnet, so it is the one Caddy must address them on.
  net-ingress:
    name: net-ingress
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_INGRESS:?err}

  # The management applications and the things that poll their APIs.
  net-arr:
    name: net-arr
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_ARR:?err}

  # FlareSolverr, alone with Prowlarr. Its entire purpose is running headless
  # Chrome against attacker-controlled indexer pages, which makes it the most
  # likely thing here to be compromised. Prowlarr is the only service it can
  # reach and the only one that can reach it.
  net-solver:
    name: net-solver
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_SOLVER:?err}

  # Everything that talks to qBittorrent's API, which means everything that
  # talks to gluetun - see below.
  net-download:
    name: net-download
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_DOWNLOAD:?err}

  # Jellyfin is the mirror image of FlareSolverr: the most exposed service here,
  # reachable from the LAN as well as the internet, yet it initiates no internal
  # connections at all. Only Jellyseerr reads from it.
  net-media:
    name: net-media
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_MEDIA:?err}

  # The Tdarr nodes connect out to their server and to nothing else.
  net-transcode:
    name: net-transcode
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_TRANSCODE:?err}

  # For services that talk only to the internet. A container still needs some
  # bridge to get NAT egress, and putting them on one with peers would hand them
  # reachability they have no use for.
  net-egress:
    name: net-egress
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET_SUBNET_EGRESS:?err}

# ------------------------------------------------------------------------------
# Services
# ------------------------------------------------------------------------------
# Individual containers are defined under this block.
# ------------------------------------------------------------------------------

services:

  # ----------------------------------------------------------------------------
  # Gluetun: VPN Client
  # ----------------------------------------------------------------------------
  # The qBittorrent container connects to the internet through this one which
  # uses a VPN to encrypt data transmitted over.
  #
  # This container must be running and healthy before qBittorrent can start.
  #
  # Image:  https://github.com/qdm12/gluetun/pkgs/container/gluetun
  # See:    https://github.com/qdm12/gluetun/wiki
  # ----------------------------------------------------------------------------

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/gluetun:/gluetun
    devices:
      - /dev/net/tun:/dev/net/tun
    # qBittorrent and JOAL live in this container's network namespace, so this
    # entry is their networking too. Everything that needs to reach either of
    # them addresses gluetun instead, and joins net-download to do it.
    networks:
      - net-download
    # Nothing is published on the host.
    #
    # The web UIs of the two containers sharing this namespace are reached
    # through Caddy over the bridge, and no peer port is needed either:
    # incoming peers arrive through the WireGuard tunnel on the port ProtonVPN
    # forwards, which lands directly in this namespace. Publishing 6881 would
    # only forward to a port nothing listens on. PORT_QBITTORRENT_TCP and _UDP
    # are kept in .env solely as a fallback for running without a VPN.
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - FIREWALL_OUTBOUND_SUBNETS=${NET_LOCAL_SUBNET:?err}

      # Off. Both ran without credentials - HTTPPROXY_USER, HTTPPROXY_PASSWORD
      # and SHADOWSOCKS_PASSWORD were all empty - which made them an open proxy
      # into the VPN for anything on the LAN. Nothing here used them. If you
      # want them back, set credentials at the same time, and remember that
      # binding them to BIND_LAN does not keep them off the public interface:
      # Docker's DNAT rules are evaluated before firewalld's zone filtering.
      - HTTPPROXY=off
      - SHADOWSOCKS=off

      # ProtonVPN over WireGuard. For this provider gluetun already knows every
      # server's public key, endpoint and tunnel address from its embedded server
      # list, so WIREGUARD_PRIVATE_KEY is the only credential required - generate
      # a WireGuard config in the Proton dashboard and copy its PrivateKey.
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:?err}
      - VPN_TYPE=${VPN_TYPE:?err}
      - WIREGUARD_PRIVATE_KEY=${VPN_WG_PRIVATE_KEY:?err}

      # Port forwarding requires NAT-PMP to have been ticked when the WireGuard
      # config was generated; PORT_FORWARD_ONLY restricts server selection to
      # nodes that actually support it.
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on

      # ProtonVPN hands out a different forwarded port on every reconnect, but
      # qBittorrent's listen port is static in its config. Left alone the two
      # drift apart and no incoming peer can reach the client. This pushes the
      # new port into qBittorrent over its API each time the tunnel comes up.
      # qBittorrent shares this container's network namespace, so 127.0.0.1
      # reaches it, and WebUI\LocalHostAuth=false lets the call skip auth.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --retry-connrefused --post-data="json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:${PORT_QBITTORRENT_WEB:?err}/api/v2/app/setPreferences'

      # Server selection filters (all optional, leave blank for any server).
      - SERVER_CITIES=${VPN_SERVER_CITIES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - SERVER_HOSTNAMES=${VPN_SERVER_HOSTS}
      - SERVER_REGIONS=${VPN_SERVER_REGION}

      # Optional overrides. Only set these to pin a specific server or to use a
      # provider whose details gluetun does not already ship.
      - VPN_ENDPOINT_IP=${VPN_WG_ENDPOINT_ADDR}
      - VPN_ENDPOINT_PORT=${VPN_WG_ENDPOINT_PORT}
      - WIREGUARD_ADDRESSES=${VPN_WG_ADDRESSES}
      - WIREGUARD_PRESHARED_KEY=${VPN_WG_PRESHARED_KEY}
      - WIREGUARD_PUBLIC_KEY=${VPN_WG_PUBLIC_KEY}

      # OpenVPN fallback. Unused while VPN_TYPE=wireguard. The +pmp suffix on the
      # username is what enables port forwarding on ProtonVPN's OpenVPN servers.
      - OPENVPN_CUSTOM_CONFIG=${VPN_OPENVPN_CONFIG}
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 1

  # ----------------------------------------------------------------------------
  # Torrent Download Client: qBittorrent
  # ----------------------------------------------------------------------------
  # Downloader for torrent files.
  #
  # Image:  https://docs.linuxserver.io/images/docker-qbittorrent
  # ----------------------------------------------------------------------------

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:libtorrentv1
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/qbittorrent:/config
      - ${DOCKER_VOLUME_MEDIA:?err}:/data
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${PORT_QBITTORRENT_WEB:?err}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
      - TP_THEME=${TP_THEME:?err}

  # ----------------------------------------------------------------------------
  # Torrent Fake-Upload Client: JOAL (Jack of All Trades)
  # ----------------------------------------------------------------------------
  # Fake-upload torrent files to cheat ratios.
  #
  # Image:  https://hub.docker.com/r/anthonyraymond/joal
  # See:    https://github.com/anthonyraymond/joal
  # ----------------------------------------------------------------------------

  joal:
    image: anthonyraymond/joal:latest
    container_name: joal
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    command:
      - --joal-conf=/config
      - --spring.main.web-environment=true
      - --server.port=${PORT_JOAL_WEB:?err}
      - --joal.ui.path.prefix=${JOAL_OBFUSCATION_PATH:?err}
      - --joal.ui.secret-token=${JOAL_SECRET_TOKEN:?err}
    # JOAL announces to trackers, so it belongs behind the VPN for the same
    # reason qBittorrent does. It previously sat on the shared bridge, which
    # meant its announces carried the host's own IP while qBittorrent's went
    # through ProtonVPN. Like qBittorrent it has no address of its own, so Caddy
    # reaches its web UI at gluetun:${PORT_JOAL_WEB}.
    network_mode: "service:gluetun"
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/joal:/config
      - ${DOCKER_VOLUME_MEDIA:?err}/downloads/faking:/config/torrents
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

  # ----------------------------------------------------------------------------
  # Identity Provider: Pocket ID
  # ----------------------------------------------------------------------------
  # Passkey-only OpenID Connect provider. There are no passwords to phish, leak
  # or rotate - authentication is a WebAuthn signature from a device the user
  # already carries.
  #
  # It is only an OIDC *provider*: it has no forward-auth endpoint, so Tinyauth
  # below is what turns Caddy's forward_auth into an OIDC flow. Applications
  # that speak OIDC natively can point straight here instead.
  #
  # Deliberately publishes no host port. It is reached only through Caddy, which
  # is also what gives it the HTTPS that WebAuthn refuses to work without.
  #
  # Image:  https://github.com/pocket-id/pocket-id/pkgs/container/pocket-id
  # See:    https://pocket-id.org/docs/configuration/environment-variables
  # ----------------------------------------------------------------------------

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/pocket-id:/app/data
    networks:
      - net-ingress
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      # Must match the URL the browser actually uses, port included. WebAuthn
      # validates the full origin string from the browser against this, and a
      # port mismatch fails the registration ceremony at the finish step with a
      # generic "couldn't process the response from your passkey".
      - APP_URL=${POCKETID_APP_URL:?err}
      - TRUST_PROXY=${NET_SUBNET_INGRESS:?err}
      # Encrypts the passkey and OIDC client material at rest. Losing it means
      # losing every registered credential, so it belongs in the backup.
      - ENCRYPTION_KEY=${POCKETID_ENCRYPTION_KEY:?err}

  # ----------------------------------------------------------------------------
  # Forward Authentication: Tinyauth
  # ----------------------------------------------------------------------------
  # Sits between Caddy and the applications that have no SSO of their own. Caddy
  # asks it whether a request is authorised; if not, it runs the OIDC flow
  # against Pocket ID and the passkey prompt happens there.
  #
  # The whitelist matters: without it any account Pocket ID knows about can sign
  # in to everything.
  #
  # Image:  https://github.com/tinyauthapp/tinyauth/pkgs/container/tinyauth
  # See:    https://tinyauth.app/docs/guides/pocket-id
  # ----------------------------------------------------------------------------

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    container_name: tinyauth
    restart: unless-stopped
    depends_on:
      - pocket-id
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/tinyauth:/data
    networks:
      - net-ingress
    environment:
      - TZ=${TIMEZONE:?err}
      - TINYAUTH_APPURL=https://auth.${DOMAIN:?err}
      - TINYAUTH_DATABASE_PATH=/data/tinyauth.db
      # Everything reaches Tinyauth through Caddy, so without this it would see
      # Caddy's address as the client and every IP-based rule would be wrong.
      - TINYAUTH_AUTH_TRUSTEDPROXIES=${NET_SUBNET_INGRESS:?err}
      - TINYAUTH_AUTH_SECURECOOKIE=true
      # Skip Tinyauth's own login page and go straight to the passkey prompt.
      - TINYAUTH_OAUTH_AUTOREDIRECT=pocketid
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME=Pocket ID
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID=${POCKETID_CLIENT_ID}
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET=${POCKETID_CLIENT_SECRET}
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL=https://id.${DOMAIN:?err}/authorize
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL=https://id.${DOMAIN:?err}/api/oidc/token
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL=https://id.${DOMAIN:?err}/api/oidc/userinfo
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL=https://auth.${DOMAIN:?err}/api/oauth/callback/pocketid
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES=openid email profile groups
      - TINYAUTH_OAUTH_PROVIDERS_POCKETID_WHITELIST=${AUTH_WHITELIST}

  # ----------------------------------------------------------------------------
  # Reverse Proxy: Caddy
  # ----------------------------------------------------------------------------
  # Replaces SWAG as the single TLS terminator. Built from ./ingress/Dockerfile
  # because the stock image carries no DNS provider modules and certificates
  # here are issued over DNS-01 against Gandi.
  #
  # Routing lives in ./ingress/Caddyfile, mounted as a directory rather than a
  # single file so that a `git pull` replacing the file does not leave the
  # container holding a stale inode.
  #
  # /data holds the certificates, private keys and the ACME account. It is not
  # regenerable without re-issuing everything, so it belongs in the backup.
  #
  # Image:  built locally, see ./ingress/Dockerfile
  # ----------------------------------------------------------------------------

  caddy:
    build:
      context: ./ingress
    image: media-stack/caddy:latest
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - tinyauth
    volumes:
      - ./ingress:/etc/caddy:ro
      - ${DOCKER_VOLUME_CONFIG:?err}/caddy/data:/data
      - ${DOCKER_VOLUME_CONFIG:?err}/caddy/config:/config
    # One entry per segment, because Caddy is the only thing allowed to cross
    # them. Deliberately not on net-solver: FlareSolverr has no route worth
    # exposing, and giving the proxy a leg into that segment would undo the
    # point of isolating it.
    networks:
      - net-ingress
      - net-arr
      - net-download
      - net-media
      - net-transcode
    ports:
      # Public ingress. These are the only ports the router forwards, and every
      # service reaches the outside world through them.
      - "${PORT_CADDY_HTTP:?err}:80"                                # Public ingress
      - "${PORT_CADDY_HTTPS:?err}:443"                              # Public ingress
    environment:
      - TZ=${TIMEZONE:?err}
      - DOMAIN=${DOMAIN:?err}
      - GANDI_BEARER_TOKEN=${GANDI_BEARER_TOKEN:?err}
      # Upstream ports for the services whose listening port is itself set from
      # the environment, so the Caddyfile cannot drift from the service config.
      - PORT_TDARR_WEB=${PORT_TDARR_WEB:?err}
      - PORT_QBITTORRENT_WEB=${PORT_QBITTORRENT_WEB:?err}
      - PORT_JOAL_WEB=${PORT_JOAL_WEB:?err}

  # ----------------------------------------------------------------------------
  # Cloudflare Protection Bypass: FlareSolverr
  # ----------------------------------------------------------------------------
  # Proxy server to bypass Cloudflare and DDoS-GUARD protection.
  #
  # Image:  https://hub.docker.com/r/flaresolverr/flaresolverr
  # See:    https://github.com/FlareSolverr/FlareSolverr
  # ----------------------------------------------------------------------------

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    # Alone with Prowlarr. This is the container most likely to be compromised,
    # since it exists to render pages from indexer sites in a real browser. It
    # still reaches the internet - every bridge NATs out - but from here it can
    # see nothing else in the stack.
    networks:
      - net-solver
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:?err}

  # ----------------------------------------------------------------------------
  # Dynamic Domin Updater: DuckDNS
  # ----------------------------------------------------------------------------
  # Duckdns is a free service which will point a DNS
  # (sub domains of duckdns.org) to an IP of your choice. The service
  # is completely free, and doesn't require reactivation or forum posts
  # to maintain its existence.
  #
  # Image:  https://docs.linuxserver.io/images/docker-duckdns
  # ----------------------------------------------------------------------------

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/duckdns:/config
    # Talks to DuckDNS and nothing else, so it gets a bridge with no peers.
    networks:
      - net-egress
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - SUBDOMAINS=${DDNS_SUBDOMAINS:?err}
      - TOKEN=${DDNS_TOKEN:?err}
      - LOG_FILE=true

  # ----------------------------------------------------------------------------
  # Search Indexer and Manager: Prowlarr
  # ----------------------------------------------------------------------------
  # Prowlarr is a indexer manager/proxy built on the popular arr
  # `.net`/`reactjs` base stack to integrate with your various PVR apps.
  # Prowlarr supports both Torrent Trackers and Usenet Indexers. It integrates
  # seamlessly with Sonarr, Radarr, Lidarr, and Readarr offering complete
  # management of your indexers with no per app Indexer setup required
  # (we do it all).
  #
  # Image:  https://docs.linuxserver.io/images/docker-prowlarr
  # ----------------------------------------------------------------------------

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - flaresolverr
      - gluetun
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/prowlarr:/config
    # The only service in three segments: it syncs indexers to Sonarr and Radarr
    # (net-arr), pushes releases to qBittorrent (net-download), and is the sole
    # consumer of FlareSolverr (net-solver). That also makes it the one hop
    # between a compromised solver and everything else, which is why its own
    # login stays enabled.
    networks:
      - net-arr
      - net-solver
      - net-download
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:prowlarr
      - TP_THEME=${TP_THEME:?err}

  # ----------------------------------------------------------------------------
  # Movie Library Manager: Radarr
  # ----------------------------------------------------------------------------
  # Manage searching for and downloading movies.
  #
  # Image:  https://docs.linuxserver.io/images/docker-radarr
  # ----------------------------------------------------------------------------

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/radarr:/config
      - ${DOCKER_VOLUME_MEDIA:?err}:/data
    networks:
      - net-arr
      - net-download
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:radarr
      - TP_THEME=${TP_THEME:?err}

  # ----------------------------------------------------------------------------
  # TV Shows Library Manager: Sonarr
  # ----------------------------------------------------------------------------
  # Manage searching for and downloading TV shows.
  #
  # Image:  https://docs.linuxserver.io/images/docker-sonarr
  # ----------------------------------------------------------------------------

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    depends_on:
      - prowlarr
      - qbittorrent
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/sonarr:/config
      - ${DOCKER_VOLUME_MEDIA:?err}:/data
    networks:
      - net-arr
      - net-download
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:sonarr
      - TP_THEME=${TP_THEME:?err}

  # ----------------------------------------------------------------------------
  # Media Server: Jellyfin
  # ----------------------------------------------------------------------------
  # Manage searching for and downloading TV shows.
  #
  # Image:  https://docs.linuxserver.io/images/docker-jellyfin
  # See:    https://jellyfin.org/docs/general/administration/installing#docker
  #         https://jellyfin.org/docs/general/administration/hardware-acceleration/
  # ----------------------------------------------------------------------------

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/jellyfin:/config
      - ${DOCKER_VOLUME_MEDIA:?err}/library:/data/media
    # Reachable by Caddy and Jellyseerr, and able to reach neither of them back
    # into the rest of the stack. Jellyfin initiates no internal connections at
    # all, which is what makes this segment as small as it is.
    networks:
      - net-media
    ports:
      - "${BIND_LAN:?err}:${PORT_JELLYFIN_WEB:?err}:8096"           # LAN clients connect directly
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

  # ----------------------------------------------------------------------------
  # Media Request Manager: Jellyseerr
  # ----------------------------------------------------------------------------
  # Allows users to search for and download TV shows automatically.
  #
  # Image:  https://hub.docker.com/r/fallenbagel/jellyseerr
  # ----------------------------------------------------------------------------

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    depends_on:
      - jellyfin
      - radarr
      - sonarr
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/jellyseerr:/app/config
    # Reads the library from Jellyfin and files requests into Sonarr and Radarr,
    # so it is the one service that legitimately spans both segments.
    networks:
      - net-arr
      - net-media
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

  # ----------------------------------------------------------------------------
  # Video Transcoding: Tdarr
  # ----------------------------------------------------------------------------
  # Automatically transcode video files.
  # The server orchestrate the work between workers (AKA nodes).
  # Each node is responsible of transcoding movies and running healthchecks
  # on the files. They all have access to one and only one disctinct GPU
  # to ensure equal repartition of the workload over those.
  #
  # Image:  https://github.com/users/haveagitgat/packages/container/package/tdarr
  # See:    https://github.com/HaveAGitGat/Tdarr
  #         https://docs.tdarr.io/docs/installation/docker/run-compose
  # ----------------------------------------------------------------------------

  # ----------------------------------------------------------------------------
  # Tdarr Server
  # ----------------------------------------------------------------------------

  tdarr-server:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr-server
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/server:/app/server
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/configs:/app/configs
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/logs:/app/logs
      - ${DOCKER_VOLUME_CACHE:?err}/tdarr:/temp
      - ${DOCKER_VOLUME_MEDIA:?err}:/media
    networks:
      - net-transcode
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - internalNode=false
      - nodeID=TdarrServer

  # ----------------------------------------------------------------------------
  # Tdarr Node 01
  # ----------------------------------------------------------------------------

  tdarr-node-01:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node-01
    restart: unless-stopped
    depends_on:
      - tdarr-server
    runtime: nvidia
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/configs:/app/configs
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/logs:/app/logs
      - ${DOCKER_VOLUME_CACHE:?err}/tdarr:/temp
      - ${DOCKER_VOLUME_MEDIA:?err}:/media
    networks:
      - net-transcode
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - nodeID=TdarrNode01
      - serverIP=tdarr-server
      - serverPort=${PORT_TDARR_SERVER:?err}
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all

  # ----------------------------------------------------------------------------
  # Tdarr Node 02
  # ----------------------------------------------------------------------------

  tdarr-node-02:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node-02
    restart: unless-stopped
    depends_on:
      - tdarr-server
    runtime: nvidia
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/configs:/app/configs
      - ${DOCKER_VOLUME_CONFIG:?err}/tdarr/logs:/app/logs
      - ${DOCKER_VOLUME_CACHE:?err}/tdarr:/temp
      - ${DOCKER_VOLUME_MEDIA:?err}:/media
    networks:
      - net-transcode
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - nodeID=TdarrNode02
      - serverIP=tdarr-server
      - serverPort=${PORT_TDARR_SERVER:?err}
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=all

  # ----------------------------------------------------------------------------
  # Media Archive Extraction: Unpackerr
  # ----------------------------------------------------------------------------
  # Check for completed downloads and extract them so Lidarr, Radarr, Readarr,
  # and Sonarr may import them. Small single-binary with reasonable logging
  # that can extract downloaded archives and clean up the mess after they've
  # been imported.
  #
  # Image:  https://github.com/Unpackerr/unpackerr
  # See:    https://github.com/Unpackerr/unpackerr#readme
  #         https://github.com/Unpackerr/unpackerr#docker-env-variables
  # ----------------------------------------------------------------------------

  unpackerr:
    image: ghcr.io/hotio/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_VOLUME_CONFIG:?err}/unpackerr:/config
      - ${DOCKER_VOLUME_MEDIA:?err}:/data
    # Unpackerr polls the Sonarr/Radarr queue APIs to learn what to extract, so
    # it needs a network. It previously ran `network_mode: none`, which left it
    # logging "network is unreachable" every 2 minutes since at least Feb 2025
    # without ever extracting anything. It publishes no ports of its own, and
    # never touches the download client - it works off the filesystem.
    networks:
      - net-arr
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - UN_DEBUG=false
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_LOG_FILES=10
      - UN_LOG_FILE_MB=10
      - UN_INTERVAL=2m
      - UN_START_DELAY=1m
      - UN_RETRY_DELAY=5m
      - UN_MAX_RETRIES=3
      - UN_PARALLEL=1
      - UN_FILE_MODE=0664
      - UN_DIR_MODE=0775

      # Sonarr
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/downloads/sonarr
      - UN_SONARR_0_PROTOCOLS=torrent,usenet
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_DELETE_DELAY=5m

      # Radarr
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/downloads/radarr
      - UN_RADARR_0_PROTOCOLS=torrent,usenet
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_DELETE_DELAY=5m
